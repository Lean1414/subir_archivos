<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subir archivo</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="card">
        <div class="icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V4m0 0L7 9m5-5 5 5"></path>
                <path d="M20 16.5v2A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5v-2"></path>
            </svg>
        </div>
        <h1>Subir un archivo</h1>
        <p class="description">Selecciona el archivo que quieres guardar. Asegúrate de que tenga uno de los formatos permitidos.</p>

        <form action="guardar.php" method="POST" enctype="multipart/form-data">
            <label for="archivo">Elige un archivo</label>
            <input id="archivo" type="file" name="archivo" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp" required>
            <p class="hint">Formatos permitidos: PDF, JPG, PNG, GIF y WEBP.</p>
            <button type="submit">Guardar archivo</button>
        </form>
    </main>
</body>
</html>
